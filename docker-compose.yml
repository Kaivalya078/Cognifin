# Production: API + Caddy (automatic HTTPS). See "Deploy" in README.md.
#   API_DOMAIN=api.example.com docker compose up -d --build
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ASSET_MODE: remote
      INDEX_CACHE_DIR: /data/index_cache
      # 1 GB VM (measured: ~0.5 GB app memory, ~0.6 GB with one large upload held).
      # One upload session at a time: a new upload ends the previous one.
      SESSION_MAX: ${SESSION_MAX:-1}
    # Restart the API instead of letting it push the whole VM into swap. Tune on the VM.
    mem_limit: ${API_MEM_LIMIT:-750m}
    volumes:
      - index:/data            # index downloaded once, survives restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      start_period: 15m        # first boot downloads + extracts the ~3.5 GB index

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN to the API hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # TLS certificates
    depends_on:
      - api
    restart: unless-stopped

volumes:
  index:
  caddy_data:
