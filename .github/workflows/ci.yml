# Lint, unit tests and the offline eval gates on every push to main and every PR.
# Zero cost: no API keys, no 2.3 GB index. The retrieval/faithfulness evals run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # CPU-only torch: the default Linux wheel pulls ~2.5 GB of CUDA libraries CI never uses.
      - name: Install dependencies
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      # ~22 tests load the embedding model; cache it between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-v1

      - name: Lint (ruff)
        run: ruff check .

      # Committed 2 MB snapshot (used by the eval gates and the router tests); refresh after
      # a financials rebuild:  cp index_cache/financials.duckdb tests/fixtures/
      - name: Financials snapshot
        run: mkdir -p index_cache && cp tests/fixtures/financials.duckdb index_cache/

      - name: Unit tests
        run: python -m pytest tests/test_*.py -q

      - name: Financials eval (gate)
        run: |
          set -o pipefail
          { echo '### Financials eval'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m tests.eval_financials --label ci --min-precision 100 --min-coverage 93.9 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Router eval (gate)
        run: |
          set -o pipefail
          { echo '### Router eval (no LLM)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python tests/eval_router.py --strict | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit checks
        run: for f in src/utils/*.check.mjs; do node "$f" || exit 1; done
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://api.example.invalid
