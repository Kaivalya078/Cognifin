<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>Cognifin</title>
  <meta name="description"
    content="Ask about the NIFTY 100. Cognifin answers from annual reports and quarterly results, and every answer cites the page it came from." />
  <meta name="keywords" content="Cognifin, NIFTY 100, annual reports, quarterly results, RAG, financial analysis" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/cognifin-icon.svg" />
  <link rel="icon" type="image/png" href="/cognifin-icon.png" />
  <link rel="apple-touch-icon" href="/cognifin-icon.png" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <!-- Open Graph -->
  <meta property="og:title" content="Cognifin — answers from NIFTY 100 filings, with the page cited" />
  <meta property="og:description" content="Ask about India's 100 largest listed companies. Every answer points to its page." />
  <meta property="og:type" content="website" />
  <!-- Crawlers (LinkedIn, X, Slack) need an absolute URL: set VITE_SITE_URL at build -->
  <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    /* Prevent FOUC */
    html {
      background: #0a0a0a;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
